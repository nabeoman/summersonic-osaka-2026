@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
.banner-viewport {

.banner-track {

.banner.marquee .banner-track {

}
@keyframes banner-scroll {

  }
}

function getStatus(items, nowMin) {
  const active = items.filter(it => it[3] !== 'CANCELED');
  const live = active.find(it => toMin(it[0]) <= nowMin && nowMin < toMin(it[1]));
  if (live) {
    const idx = active.indexOf(live);
    return { status: 'live', item: live, next: active[idx+1] || null };
  }
  const upcoming = active.filter(it => toMin(it[0]) > nowMin).sort((a,b) => toMin(a[0]) - toMin(b[0]));
  if (upcoming.length) return { status: 'next', item: upcoming[0] };
  if (active.length && nowMin >= toMin(active[active.length-1][1])) return { status: 'ended' };
  return { status: 'before' };
}

function tick() {
  const n = nowJST();
  document.getElementById('clockTime').textContent = fmtClockTime(n);
  document.getElementById('clockDate').textContent = fmtClockDate(n);

  const todayKey = ymd(n);
  const isToday = selectedDay === todayKey;
  const nowMin = n.getHours()*60 + n.getMinutes() + n.getSeconds()/60;
  const daySchedule = DATA.schedule[selectedDay];

  renderGrid(daySchedule, nowMin, isToday);
  renderBanner(daySchedule, nowMin, isToday);
  renderFull(daySchedule, nowMin, isToday);

  // keep active tab label live for TODAY marker changes across midnight
  document.querySelectorAll('.tab').forEach((btn, i) => {
    const k = dayKeys[i];
    if (k === todayKey && !btn.querySelector('.sub').textContent.includes('TODAY')) renderTabs();
  });
}

let lastBannerSig = '';

function renderBanner(daySchedule, nowMin, isToday) {
  const banner = document.getElementById('banner');
  const track = document.getElementById('bannerTrack');
  if (!isToday) { banner.classList.remove('show', 'marquee'); lastBannerSig = ''; return; }

  const upcoming = [];
  for (const st of DATA.stages) {
    const items = (daySchedule[st.id] || []).filter(it => it[3] !== 'CANCELED');
    const up = items.filter(it => toMin(it[0]) > nowMin).sort((a,b) => toMin(a[0]) - toMin(b[0]));
    if (up.length) {
      const diff = Math.round(toMin(up[0][0]) - nowMin);
      if (diff <= 15) upcoming.push({ item: up[0], stage: st, diff });
    }
  }
  if (!upcoming.length) { banner.classList.remove('show', 'marquee'); lastBannerSig = ''; return; }
  upcoming.sort((a,b) => a.diff - b.diff);
  banner.classList.add('show');

  // 内容（アーティスト・ステージ・分）が変わらない限りDOMを触らず、アニメーションを継続させる
  const sig = upcoming.map(u => `${u.item[2]}|${u.stage.id}|${u.diff}`).join(',');
  if (sig === lastBannerSig) return;
  lastBannerSig = sig;

  const segHtml = upcoming.map(u =>
    `<span class="sep">★</span>もうすぐ! <b>${escapeHtml(u.item[2])}</b> が ${u.stage.name} で ${fmtDur(u.diff)}後にスタート`
  ).join('');

  if (upcoming.length === 1) {
    banner.classList.remove('marquee');
    track.style.cssText = '';
    track.innerHTML = `<span class="seg">${segHtml}</span>`;
  } else {
    banner.classList.add('marquee');
    track.style.cssText = '';
    track.innerHTML = `<span class="seg">${segHtml}</span><span class="seg" aria-hidden="true">${segHtml}</span>`;
    requestAnimationFrame(() => {
      const seg = track.querySelector('.seg');
      const w = seg.getBoundingClientRect().width;
      const duration = Math.max(10, w / 55);
      track.style.setProperty('--marquee-dist', `-${w}px`);
      track.style.animationDuration = duration + 's';
    });
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderGrid(daySchedule, nowMin, isToday) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (const st of DATA.stages) {
    const items = daySchedule[st.id] || [];
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--stage-color', st.color);

    const head = document.createElement('div');
    head.className = 'card-head';
    head.style.background = st.color;

    let badgeHtml = '';
    let bodyHtml = '';

    if (!isToday) {
      badgeHtml = `<span class="badge">${dayLabels[selectedDay].md}</span>`;
      const first = items.find(it => it[3] !== 'CANCELED');
      bodyHtml = first
        ? `<div class="artist muted">${escapeHtml(first[2])}</div><div class="time">${first[0]} - ${first[1]} 他 ${items.length}組</div>`
        : `<div class="artist muted">情報なし</div>`;
    } else {
      const r = getStatus(items, nowMin);
      if (r.status === 'live') {
        const [s,e,name] = r.item;
        const pct = Math.min(100, Math.max(0, (nowMin - toMin(s)) / (toMin(e) - toMin(s)) * 100));
        const remain = toMin(e) - nowMin;
        badgeHtml = `<span class="badge live">LIVE</span>`;
        bodyHtml = `
          <div class="artist">${escapeHtml(name)}</div>
          <div class="time">${s} - ${e}</div>
          <div class="bar"><i style="width:${pct}%"></i></div>
          <div class="countdown live">のこり ${fmtDur(remain)}</div>
          ${r.next ? `<div class="upnext">NEXT: <b>${escapeHtml(r.next[2])}</b> (${r.next[0]} - ${r.next[1]})</div>` : ''}
        `;
      } else if (r.status === 'next') {
        const [s,e,name,tag] = r.item;
        const until = toMin(s) - nowMin;
        badgeHtml = `<span class="badge">NEXT</span>`;
        bodyHtml = `
          ${tag ? `<span class="note">${escapeHtml(tag)}</span>` : ''}
          <div class="artist">${escapeHtml(name)}</div>
          <div class="time">${s} - ${e}</div>
          <div class="countdown next" style="color:${st.color}">${fmtDur(until)}後</div>
        `;
      } else if (r.status === 'ended') {
        badgeHtml = `<span class="badge">終了</span>`;
        bodyHtml = `<div class="artist muted">本日のライブは終了しました</div>`;
      } else {
        badgeHtml = `<span class="badge">OPEN前</span>`;
        const first = items[0];
        bodyHtml = first
          ? `<div class="artist muted">最初のアクト</div><div class="time">${first[0]}〜 ${escapeHtml(first[2])}</div>`
          : `<div class="artist muted">情報なし</div>`;
      }
    }

    head.innerHTML = `<div><div class="stage disp">${st.name}</div><div class="venue">${escapeHtml(st.venue)}</div></div>${badgeHtml}`;
    const expanded = expandedStages.has(st.id);
    if (expanded) card.classList.add('expanded');

    const body = document.createElement('div');
    body.className = 'card-body';
    body.innerHTML = bodyHtml + `<div class="expand-hint"><span class="chev">▾</span>${expanded ? '閉じる' : '全アクトを見る'}</div>`;

    card.appendChild(head);
    card.appendChild(body);
    if (expanded) {
      const list = document.createElement('div');
      list.className = 'expand-list';
      // 現在LIVE中・終了済みは下部の「タイムテーブル全体」で見られるので、ここではNEXT以降だけを表示する
      let visibleItems = items;
      let nextIt = null;
      if (isToday) {
        nextIt = nextItemOf(items, nowMin, isToday);
        visibleItems = nextIt ? items.slice(items.indexOf(nextIt)) : [];
      }
      list.innerHTML = visibleItems.length
        ? visibleItems.map(it => rowHtml(it, nowMin, isToday, it === nextIt)).join('')
        : `<div class="full-row"><span class="name">本日のこれ以降のアクトはありません</span></div>`;
      card.appendChild(list);
    }
    card.addEventListener('click', () => toggleExpand(st.id));
    grid.appendChild(card);
  }
}

function renderFull(daySchedule, nowMin, isToday) {
  document.getElementById('fullTitle').textContent = `タイムテーブル全体 ー ${dayLabels[selectedDay].md} (${dayLabels[selectedDay].wd})`;
  const full = document.getElementById('full');
  full.innerHTML = '';
  for (const st of DATA.stages) {
    const items = daySchedule[st.id] || [];
    const col = document.createElement('div');
    col.className = 'full-col';
    col.style.setProperty('--stage-color', st.color);
    const h3 = document.createElement('h3');
    h3.className = 'disp';
    h3.style.background = st.color;
    h3.textContent = st.name;
    col.appendChild(h3);
    const nextIt = nextItemOf(items, nowMin, isToday);
    col.insertAdjacentHTML('beforeend', items.map(it => rowHtml(it, nowMin, isToday, it === nextIt)).join(''));
    full.appendChild(col);
  }
}

init();
</script>
